[metadata]
author_name = "Inesh Reddy Chappidi"
author_email = "ineshhreddy249@gmail.com"

difficulty_explanation = """
Who does this: a genebank curator, or whoever in a seed store works the day
book and decides what goes out against a request. The job is to reproduce the
store's own practice as a program, not to read a figure out of a file.

What is asked for: a program, `/app/releases.py`, given one campaign as JSON on
standard input and printing, for each request in it, the name of the lot the
store releases. It is marked by being run on 30 campaigns rebuilt in the
verifier from a seed that never ships, 289 requests in all. The
answer is a NAME, so there is no quantity to scale and nothing a wrong reading
can be fitted back into.

What ships: `/app/GENEBANK.md`, which sets out the whole of the store's
practice, and `/app/worked.json` - 14 worked campaigns, 228
requests, each carrying the name the store gave. Nothing is concealed;
everything needed is derivable from what ships.

Where the difficulty is. The note states the practice in full except for
5 matters it openly admits the store has never written down -
whether a lot holding exactly the hundred may go, whether a lot split off
carries the date of the test it inherits, whether a test dated the day of a
request is in effect for it, and so on. Those make a grid of readings. Set
against them is one sentence the note does not flag at all: of the lots it can
release, the store releases the oldest seed. Read naturally, that is the oldest
lot - the day the lot itself came into being, which every engine has to hand.
Read as the store works, it is the age of the SEED: seed keeps the day it was
first deposited wherever it goes afterwards, so a lot made up by topping one
lot from another is as old as the older part of it, and a lot split off is as
old as its parent's seed however new the lot is. Nothing in a correct engine
keeps that date unless the rule has been understood, and because it orders the
candidates it decides every request rather than a handful near a boundary.

The whole grid is 96 readings. **Exactly one of them reproduces all
228 worked answers.**

The measured ladder, at 10 points a request, top score 2890:

    the reference                                  2890   (100%)
    every reading going by the age of the seed  2870..2890
    the bar                                        2790
    every reading going by the age of the lot   2680..2700
    naming the commonest lot every time            610

Nothing lands between 2700 and 2870. So all 5
signposted matters can be read wrongly and the task is still passed, and the
one unsignposted reading decides it on its own. tests/rival_readings.py walks
the grid and asserts every line of that table.
"""

solution_explanation = """
solution/releases.py is standard-library Python, about a hundred lines. It
plays the campaign forward, keeping for each lot its accession, its seeds, its
last germination figure with the day it was made, whether it is still in the
store, whether it is under hold, and the day the oldest seed now in it was
first deposited. A split hands the parent's figure, test date and seed date to
the child; a top-up weights the two figures by the seeds each part brings and
takes the older of both the test dates and the seed dates; a regeneration
starts a new lot on its own figure. At a request it takes the lots of that
accession still in the store, not under hold, holding at least a hundred seeds
and tested within 365 days, and names the one whose seed is oldest, breaking a
tie by name. It scores 2890 of 2890.
"""

verification_explanation = """
tests/grader.py rebuilds the 30 graded campaigns from a seed held only in
the verifier image and runs the agent's `/app/releases.py` as a subprocess, one
campaign at a time, with the campaign on standard input. Nothing of the agent's
is imported into the marking process, and the graded campaigns never reach the
agent's container. Each request is worth 10 when the lot named is the one the
store released and nothing otherwise, giving a top score of 2890; the reward
is 1 at 2790 and 0 below it. Partial credit is deliberate, so that a slip on
one campaign cannot decide the reward, and the bar sits in an empty band
2700 to 2870 which the measured ladder shows nothing occupies -
it separates the one reading that matters from every other, and from no other.
A program that crashes, hangs beyond 60 seconds on a campaign, or prints
nothing scores nothing for that campaign. An empty container scores 0 and the
reference scores 2890. The generator is seeded and ships in /tests, so every
figure above can be reproduced there.
"""

